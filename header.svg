<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0b0d"/>
    <stop offset="0.58" stop-color="#111013"/>
    <stop offset="1" stop-color="#171012"/>
  </linearGradient>
  <linearGradient id="redSheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e08a84" stop-opacity=".8"/>
    <stop offset=".48" stop-color="#b8494e" stop-opacity=".58"/>
    <stop offset="1" stop-color="#6c3038" stop-opacity=".1"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#242126"/>
    <stop offset="1" stop-color="#151417"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
    <feOffset dx="0" dy="10" result="off"/>
    <feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#8d858b" stroke-opacity=".12" stroke-width=".7"/>
  </pattern>
</defs>
<!-- Base -->
<rect width="1280" height="420" fill="url(#bg)"/>
<rect width="1280" height="420" fill="url(#grid)" opacity=".72"/>
<!-- restrained editorial guide lines -->
<path d="M54 64H1226 M54 356H1226" stroke="#5a4549" stroke-width="1" opacity=".7"/>
<path d="M54 64V78 M1226 64V78 M54 342V356 M1226 342V356" stroke="#d05b60" stroke-width="1.4" opacity=".85"/>
<!-- Left typography block -->
<text x="68" y="94" fill="#c96a6c" font-family="monospace" font-size="11" letter-spacing="3">PERSONAL SYSTEM / 001</text>
<text x="64" y="171" fill="#f3eff0" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="-2">ASIA BATool</text>
<text x="66" y="224" fill="#f3eff0" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="-2">MEMON</text>
<rect x="68" y="247" width="42" height="3" rx="1.5" fill="#cf5b61"/>
<text x="68" y="278" fill="#bdb5b8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.3">DESIGN  /  CODE  /  EXPERIMENT</text>
<text x="68" y="319" fill="#7f777c" font-family="monospace" font-size="10" letter-spacing="2">VISUAL DESIGNER · WEB DEVELOPMENT IN PROGRESS</text>
<!-- Floating editorial artboards, back layer -->
<g transform="translate(760 86) rotate(-10)" filter="url(#shadow)">
  <rect width="192" height="232" rx="2" fill="#09090b" stroke="#665258" stroke-width="1"/>
  <rect x="12" y="12" width="168" height="208" fill="#171519" stroke="#383036" stroke-width=".7"/>
  <text x="24" y="34" fill="#c56b70" font-family="monospace" font-size="8" letter-spacing="1.5">VISUAL STUDY 03</text>
  <path d="M24 50H168" stroke="#5d444a" stroke-width=".8"/>
  <rect x="24" y="65" width="140" height="80" fill="#211a1e"/>
  <path d="M24 131 C57 80 87 159 119 91 S151 89 164 70" fill="none" stroke="url(#redSheen)" stroke-width="2"/>
  <path d="M24 139 C63 103 85 148 120 106 S149 94 164 82" fill="none" stroke="#a34c54" stroke-width=".7" opacity=".8"/>
  <text x="24" y="167" fill="#e7e0e2" font-family="Arial, sans-serif" font-size="15" font-weight="700">FORM / FRAGMENT</text>
  <text x="24" y="184" fill="#9e9298" font-family="monospace" font-size="7">LIGHT · SURFACE · DEPTH</text>
  <path d="M24 198H164" stroke="#514047" stroke-width=".7"/>
  <text x="24" y="210" fill="#a85a60" font-family="monospace" font-size="7">A—03 / 2026</text>
</g>
<!-- Main artboard -->
<g transform="translate(894 71) rotate(7)" filter="url(#shadow)">
  <rect width="228" height="260" rx="2" fill="#0c0b0e" stroke="#8b555b" stroke-width="1.1"/>
  <rect x="10" y="10" width="208" height="240" fill="url(#paper)" stroke="#393036" stroke-width=".7"/>
  <text x="24" y="31" fill="#d77a7e" font-family="monospace" font-size="8" letter-spacing="1.5">EDITORIAL / INDEX 01</text>
  <path d="M24 43H204" stroke="#6b4147" stroke-width=".8"/>
  <text x="24" y="80" fill="#f0e9eb" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="-1">DESIGN</text>
  <text x="24" y="105" fill="#f0e9eb" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="-1">MEETS</text>
  <text x="24" y="130" fill="#d06a70" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="-1">CODE.</text>
  <rect x="24" y="145" width="180" height="62" fill="#21171b" stroke="#55353b" stroke-width=".7"/>
  <path d="M31 195 L65 160 L94 184 L130 153 L165 180 L197 158" fill="none" stroke="url(#redSheen)" stroke-width="1.6"/>
  <path d="M31 201H197" stroke="#6e4148" stroke-width=".7"/>
  <text x="24" y="224" fill="#a9a0a4" font-family="monospace" font-size="7.5" letter-spacing=".7">VISUAL SYSTEMS / WEB</text>
  <text x="24" y="237" fill="#8e777d" font-family="monospace" font-size="7.5">SELECTED WORK — 001</text>
</g>
<!-- Small floating card -->
<g transform="translate(1080 120) rotate(13)" filter="url(#shadow)">
  <rect width="126" height="144" fill="#1b171a" stroke="#604047" stroke-width="1"/>
  <text x="12" y="21" fill="#c66a70" font-family="monospace" font-size="7.5">CODE / NOTES</text>
  <path d="M12 31H113" stroke="#574047" stroke-width=".7"/>
  <g stroke-width="1.2" stroke-linecap="round">
    <path d="M13 48H57" stroke="#b85c63"/><path d="M64 48H104" stroke="#81747b"/>
    <path d="M13 61H40" stroke="#81747b"/><path d="M47 61H96" stroke="#b85c63" opacity=".8"/>
    <path d="M13 74H76" stroke="#81747b"/><path d="M13 87H49" stroke="#b85c63" opacity=".8"/>
    <path d="M57 87H106" stroke="#81747b"/>
  </g>
  <rect x="12" y="104" width="102" height="25" fill="#24171b" stroke="#643c43" stroke-width=".6"/>
  <text x="20" y="120" fill="#df9698" font-family="monospace" font-size="7">EXPERIMENT 04</text>
</g>
<!-- foreground micro details -->
<g fill="#d46a70">
  <circle cx="735" cy="98" r="2.2"/><circle cx="1165" cy="324" r="2"/>
</g>
<path d="M716 98H744 M735 89V107 M1149 324H1181 M1165 308V340" stroke="#bb5960" stroke-width=".7" opacity=".8"/>
<text x="1198" y="394" fill="#82777d" font-family="monospace" font-size="9" text-anchor="end" letter-spacing="1.5">ASIA / PORTFOLIO SYSTEM</text>
</svg>
